# Afra production worker overlay for the existing compose.yaml stack.
# Append after Afra's host-managed Compose files; do not replace them.
services:
  bale-bot:
    image: aroman-scent-companion:${SCENT_BOT_IMAGE_TAG:?Set an approved bot image tag}
    build:
      context: .
      dockerfile: Dockerfile.bot
      args:
        BOT_SOURCE_REVISION: ${SCENT_BOT_SOURCE_REVISION:?Set SCENT_BOT_SOURCE_REVISION to the approved source commit}
    command: ["node", "scripts/run-scent-companion.mjs", "bale"]
    profiles: [bale]
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
      - bot-egress
    environment:
      NODE_ENV: production
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB}
      PGUSER: aroman_bot_bale
      BALE_BOT_TOKEN_FILE: /run/secrets/bale_bot_token
      BALE_BOT_DATABASE_PASSWORD_FILE: /run/secrets/db_bale_bot_password
      DATABASE_SSL: ${DATABASE_SSL:-false}
      BOT_PUBLIC_SITE_URL: ${BOT_PUBLIC_SITE_URL:-https://aroman.ir}
      BOT_MEDIA_BASE_URL: ${BOT_MEDIA_BASE_URL:-}
      BOT_MINIAPP_URL: ${BOT_MINIAPP_URL:-}
    secrets:
      - bale_bot_token
      - db_bale_bot_password

secrets:
  bale_bot_token:
    file: ${AROMAN_SECRETS_DIR:-./secrets/production}/bale_bot_token
  db_bale_bot_password:
    file: ${AROMAN_SECRETS_DIR:-./secrets/production}/db_bale_bot_password

networks:
  # The existing backend network is shared with the website and PostgreSQL.
  # Destination restrictions still require an Afra host firewall policy.
  bot-egress:
    driver: bridge
