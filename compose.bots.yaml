# Local/dev-only overlay. Use with compose.yaml, NOT compose.prod.yaml.
# Bot services are opt-in; standard docker compose up will not start them.
x-scent-bot-base: &scent-bot-base
  build:
    context: .
    dockerfile: Dockerfile.bot
  image: aroman-scent-companion:${SCENT_BOT_IMAGE_TAG:-local}
  restart: unless-stopped
  init: true
  stop_grace_period: 45s
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  depends_on:
    migrate:
      condition: service_completed_successfully
  networks:
    - backend
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-scent-bot-env: &scent-bot-env
  NODE_ENV: production
  PGHOST: db
  PGPORT: "5432"
  PGDATABASE: ${POSTGRES_DB:-aroman}
  DATABASE_SSL: "false"
  BOT_PUBLIC_SITE_URL: ${BOT_PUBLIC_SITE_URL:-https://aroman.ir}
  BOT_MEDIA_BASE_URL: ${BOT_MEDIA_BASE_URL:-}

services:
  bot-db-roles:
    image: postgres:16.15-alpine@sha256:cbf42f0edc946c0bc1b8eeed62403734e1f25dc67a3491455d07a92fdb558b28
    profiles: [bots, telegram, bale]
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-aroman}
      PGUSER: ${POSTGRES_USER:-aroman}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your existing .env}
    volumes:
      - ./db/production:/opt/aroman/db-admin:ro
    secrets:
      - source: telegram_bot_database_password
        target: db_telegram_bot_password
      - source: bale_bot_database_password
        target: db_bale_bot_password
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for secret_file in /run/secrets/db_telegram_bot_password /run/secrets/db_bale_bot_password; do
          if [ ! -s "$secret_file" ] || [ "$(awk 'END { print NR }' "$secret_file")" -ne 1 ] || grep -q "$(printf '\\r')" "$secret_file"; then
            echo "Provider database password must be a non-empty single-line secret: $secret_file" >&2
            exit 1
          fi
        done
        psql --set ON_ERROR_STOP=1 --file /opt/aroman/db-admin/reconcile-bot-roles.sql
        psql --set ON_ERROR_STOP=1 --set database_name="$${PGDATABASE}" --set bot_user=aroman_bot_telegram --file /opt/aroman/db-admin/grant-bot-privileges.sql
        psql --set ON_ERROR_STOP=1 --set database_name="$${PGDATABASE}" --set bot_user=aroman_bot_bale --file /opt/aroman/db-admin/grant-bot-privileges.sql
    networks: [backend]

  telegram-bot:
    <<: *scent-bot-base
    profiles: [bots, telegram]
    command: ["node", "scripts/run-scent-companion.mjs", "telegram"]
    depends_on:
      bot-db-roles:
        condition: service_completed_successfully
    environment:
      <<: *scent-bot-env
      PGUSER: aroman_bot_telegram
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      TELEGRAM_BOT_DATABASE_PASSWORD_FILE: /run/secrets/telegram_bot_database_password
    secrets: [telegram_bot_token, telegram_bot_database_password]

  bale-bot:
    <<: *scent-bot-base
    profiles: [bots, bale]
    command: ["node", "scripts/run-scent-companion.mjs", "bale"]
    depends_on:
      bot-db-roles:
        condition: service_completed_successfully
    environment:
      <<: *scent-bot-env
      PGUSER: aroman_bot_bale
      BALE_BOT_TOKEN_FILE: /run/secrets/bale_bot_token
      BALE_BOT_DATABASE_PASSWORD_FILE: /run/secrets/bale_bot_database_password
    secrets: [bale_bot_token, bale_bot_database_password]

secrets:
  telegram_bot_token:
    file: ${BOT_SECRETS_DIR:-./secrets/bots}/telegram_bot_token
  bale_bot_token:
    file: ${BOT_SECRETS_DIR:-./secrets/bots}/bale_bot_token
  telegram_bot_database_password:
    file: ${BOT_SECRETS_DIR:-./secrets/bots}/db_telegram_bot_password
  bale_bot_database_password:
    file: ${BOT_SECRETS_DIR:-./secrets/bots}/db_bale_bot_password
