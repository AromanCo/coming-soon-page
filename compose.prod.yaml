name: ${COMPOSE_PROJECT_NAME:-aroman-production}

x-logging: &default-logging
  driver: local
  options:
    max-size: 10m
    max-file: "5"

services:
  caddy:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      AROMAN_DOMAIN: ${AROMAN_DOMAIN:?Set AROMAN_DOMAIN in the production environment file}
    ports:
      - target: 80
        published: "80"
        protocol: tcp
        mode: host
      - target: 443
        published: "443"
        protocol: tcp
        mode: host
      - target: 443
        published: "443"
        protocol: udp
        mode: host
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - ingress
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    logging: *default-logging

  web:
    image: aroman-coming-soon:${AROMAN_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_INSTAGRAM_URL: ${NEXT_PUBLIC_INSTAGRAM_URL:-}
        NEXT_PUBLIC_LINKEDIN_URL: ${NEXT_PUBLIC_LINKEDIN_URL:-}
        NEXT_PUBLIC_PRIVACY_EMAIL: ${NEXT_PUBLIC_PRIVACY_EMAIL:?Set NEXT_PUBLIC_PRIVACY_EMAIL}
    restart: unless-stopped
    init: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-aroman}
      PGUSER: ${POSTGRES_APP_USER:-aroman_app}
      DATABASE_PASSWORD_FILE: /run/secrets/db_app_password
      DATABASE_SSL: "false"
      DATABASE_USE_LEAST_PRIVILEGE_FUNCTIONS: "true"
      WAITLIST_HASH_SECRET_FILE: /run/secrets/waitlist_hash_secret
      CLIENT_IP_MODE: caddy
      ALLOW_INSECURE_CLIENT_IP_HEADERS: "false"
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_INSTAGRAM_URL: ${NEXT_PUBLIC_INSTAGRAM_URL:-}
      NEXT_PUBLIC_LINKEDIN_URL: ${NEXT_PUBLIC_LINKEDIN_URL:-}
      NEXT_PUBLIC_PRIVACY_EMAIL: ${NEXT_PUBLIC_PRIVACY_EMAIL:?Set NEXT_PUBLIC_PRIVACY_EMAIL}
    secrets:
      - db_app_password
      - waitlist_hash_secret
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /app/.next/cache:size=128m,uid=1000,gid=1000
    networks:
      - ingress
      - database
    logging: *default-logging

  db:
    image: postgres:16.11-alpine@sha256:4327b9fd295502f326f44153a1045a7170ddbfffed1c3829798328556cfd09e2
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-aroman_admin}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
      POSTGRES_DB: ${POSTGRES_DB:-aroman}
      POSTGRES_MIGRATION_USER: ${POSTGRES_MIGRATION_USER:-aroman_migrate}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-aroman_app}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - db_admin_password
      - db_migration_password
      - db_app_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/production/create-roles.sh:/docker-entrypoint-initdb.d/010-create-production-roles.sh:ro
      - ./db/production:/opt/aroman/db-admin:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    stop_grace_period: 60s
    shm_size: 128mb
    security_opt:
      - no-new-privileges:true
    networks:
      - database
    logging: *default-logging

  migrate:
    image: postgres:16.11-alpine@sha256:4327b9fd295502f326f44153a1045a7170ddbfffed1c3829798328556cfd09e2
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_MIGRATION_USER:-aroman_migrate}
      PGDATABASE: ${POSTGRES_DB:-aroman}
      PGPASSWORD_FILE: /run/secrets/db_migration_password
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-aroman_app}
    secrets:
      - db_migration_password
    volumes:
      - ./db/migrations:/migrations:ro
      - ./db/production/grant-runtime-privileges.sql:/opt/aroman/grant-runtime-privileges.sql:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export PGPASSWORD="$$(cat "$${PGPASSWORD_FILE}")"
        found=0
        for migration in /migrations/*.sql; do
          [ -f "$$migration" ] || continue
          found=1
          echo "Applying $$migration"
          psql --set ON_ERROR_STOP=1 --file "$$migration"
        done
        [ "$$found" -eq 1 ] || {
          echo "No SQL migrations found in /migrations" >&2
          exit 1
        }
        psql --set ON_ERROR_STOP=1 \
          --set app_user="$${POSTGRES_APP_USER}" \
          --file /opt/aroman/grant-runtime-privileges.sql
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      - database
    logging: *default-logging

secrets:
  db_admin_password:
    file: ${AROMAN_SECRETS_DIR:-./secrets/production}/db_admin_password
  db_migration_password:
    file: ${AROMAN_SECRETS_DIR:-./secrets/production}/db_migration_password
  db_app_password:
    file: ${AROMAN_SECRETS_DIR:-./secrets/production}/db_app_password
  waitlist_hash_secret:
    file: ${AROMAN_SECRETS_DIR:-./secrets/production}/waitlist_hash_secret

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  ingress:
    driver: bridge
  database:
    driver: bridge
    internal: true
